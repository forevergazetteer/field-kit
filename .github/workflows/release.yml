name: release-zip
on:
  push:
    tags: ["v*"]
jobs:
  zip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p GazetteerFieldKit
          cp GazetteerFieldKit.toc Core.lua DB.lua Events.lua UI.lua README.md LICENSE GazetteerFieldKit/
          zip -r GazetteerFieldKit.zip GazetteerFieldKit
      - uses: softprops/action-gh-release@v2
        with:
          files: GazetteerFieldKit.zip
